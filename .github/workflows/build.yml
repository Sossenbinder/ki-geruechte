name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build site
        run: node build.mjs

      - name: Check build output
        run: test -f public/index.html || { echo "public/index.html is missing"; exit 1; }
